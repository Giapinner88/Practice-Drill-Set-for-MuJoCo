[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-practice-drill-set"
version = "0.1.0"
description = "A Vietnamese, experiment-driven MuJoCo tutorial series"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.3,<4",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "sympy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
